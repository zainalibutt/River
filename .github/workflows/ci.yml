name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # package.json declares engines >= 22, and socket.ts reads the global
        # WebSocket, which Node only exposes unflagged from 22. Testing 20
        # against that failed every push from 2026-08-24 onward - 124 red runs
        # for a version the package already refused to support. Node 20 reached
        # end of life in April 2026 and GitHub deprecates it on runners.
        # 24 is what the work is actually done on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Committed secrets: every commit a push or pull request adds.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The tests that need Postgres, Auth and REST: the ledger's transactions and
  # locks, the seating book, names and bot memory, against a local Supabase
  # stack started from this commit's migrations. They skip themselves in the
  # job above, which has no database.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @river/engine
      - run: node scripts/dev-db.mjs start
      - run: node scripts/dev-db.mjs exec npx vitest run apps/server/src/ledger.local.test.ts apps/server/src/player-names.local.test.ts apps/server/src/bot-opponent-store.local.test.ts apps/server/src/player-erasure.local.test.ts apps/server/src/ban-store.local.test.ts

  # One hand in a real browser against the built app, the game server and a
  # local Supabase stack: the menu renders, a guest sits down with a bot, is
  # dealt in, acts, and the browser verifies the hand's seed. The jobs above
  # never open a page, so a table that fails to render would pass them.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/dev-db.mjs start
      - run: npm run build
      - run: node scripts/dev-db.mjs exec npx playwright test apps/web/e2e/smoke.spec.ts
        env:
          RIVER_E2E_SERVER: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
